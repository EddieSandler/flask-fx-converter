<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}FX Calculator{% endblock %}</title>

  <!-- Local CSS (demo-safe) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
</head>
<body>
  <div class="container">
    <header class="header">
      <a class="brand" href="{{ url_for('display_form') }}">
        <div class="logo">FX</div>
        <div>
          <div class="brandTitle">Currency Converter</div>
          <div class="brandSub">Flask • Azure App Service</div>
        </div>
      </a>
      <div class="tip">Use ISO codes like <b>USD</b>, <b>EUR</b>, <b>GBP</b></div>
    </header>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="alert">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

    <div class="footer">
      <span>FX Calculator</span>
      <span>Demo-safe UI (local CSS)</span>
    </div>
  </div>

  <script>
    // Uppercase + letters only for currency codes
    ["currency_1","currency_2"].forEach((id) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener("input", () => {
        el.value = el.value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 3);
      });
    });

    // Amount: allow digits, commas, dot
    const amt = document.getElementById("amount");
    if (amt) {
      amt.addEventListener("input", () => {
        amt.value = amt.value.replace(/[^\d.,]/g, "");
      });
    }
  </script>
</body>
</html>
